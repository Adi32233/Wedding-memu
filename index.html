<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f0e7" />
  <title>עדי ורני | תפריט החתונה</title>
  <style>
    :root{
      --bg:#f6f0e7;
      --paper:#fffaf3;
      --ink:#3f392f;
      --muted:#7b7368;
      --gold:#b8a07a;
      --line:rgba(90,78,60,.16);
      --shadow:0 18px 55px rgba(74,61,42,.12);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.92) 0 9%, transparent 26%),
        radial-gradient(circle at 82% 16%, rgba(219,210,194,.30) 0 8%, transparent 24%),
        linear-gradient(180deg,#faf6ef 0%,var(--bg) 56%,#f3eadf 100%);
      color:var(--ink);
      font-family: Georgia, "Times New Roman", "Noto Serif Hebrew", serif;
      padding:18px;
      overflow-x:hidden;
    }
    body:before, body:after{
      content:"";
      position:fixed;
      z-index:-1;
      width:220px;height:220px;
      border-radius:50%;
      filter:blur(1px);
      opacity:.35;
      pointer-events:none;
    }
    body:before{
      left:-95px;top:18%;
      background:radial-gradient(circle at 35% 35%,#d7dcc9 0 16%,transparent 17%),
                 radial-gradient(circle at 68% 62%,#e8ded2 0 20%,transparent 21%);
    }
    body:after{
      right:-105px;bottom:8%;
      background:radial-gradient(circle at 35% 35%,#d5d8c6 0 17%,transparent 18%),
                 radial-gradient(circle at 68% 62%,#e4d8cb 0 20%,transparent 21%);
    }
    .wrap{width:min(760px,100%);margin:0 auto}
    .hero{
      position:relative;
      overflow:hidden;
      text-align:center;
      padding:46px 22px 34px;
      margin-top:8px;
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(255,250,243,.82);
      box-shadow:var(--shadow);
      backdrop-filter:blur(7px);
    }
    .monogram{
      width:74px;height:74px;
      margin:0 auto 14px;
      border:1px solid rgba(184,160,122,.65);
      border-radius:50%;
      display:grid;
      place-items:center;
      letter-spacing:4px;
      color:#8a7658;
      font-size:25px;
      background:rgba(255,255,255,.45);
    }
    h1{
      margin:0;
      font-size:clamp(34px,8vw,56px);
      font-weight:500;
      letter-spacing:.02em;
    }
    .date{
      margin-top:8px;
      color:var(--muted);
      font-size:15px;
      letter-spacing:.13em;
    }
    .divider{
      display:flex;align-items:center;justify-content:center;
      gap:12px;margin:24px auto 18px;width:min(330px,85%);
      color:var(--gold);
    }
    .divider:before,.divider:after{
      content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }
    .subtitle{
      margin:0 0 20px;
      font-size:20px;
      color:#5b5348;
    }
    .open-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:48px;
      padding:0 24px;
      border-radius:999px;
      border:1px solid rgba(184,160,122,.55);
      color:#4e4436;
      background:#fbf6ef;
      text-decoration:none;
      font-size:17px;
      box-shadow:0 8px 24px rgba(93,76,54,.08);
      transition:.2s ease;
    }
    .open-btn:hover{transform:translateY(-1px);box-shadow:0 11px 26px rgba(93,76,54,.12)}
    .menu-card{
      margin:18px 0 10px;
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(255,250,243,.88);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .menu-head{
      padding:24px 20px 15px;
      text-align:center;
      border-bottom:1px solid var(--line);
    }
    .menu-head h2{margin:0;font-size:25px;font-weight:500}
    .menu-head p{margin:7px 0 0;color:var(--muted);font-size:14px}
    .pdf-frame{
      width:100%;
      height:min(78vh,900px);
      min-height:560px;
      border:0;
      display:block;
      background:#eee7dc;
    }
    .fallback{
      padding:18px 22px 24px;
      text-align:center;
      color:var(--muted);
      font-family:Arial,sans-serif;
      font-size:14px;
    }
    footer{
      text-align:center;
      color:#8b8174;
      font-size:13px;
      padding:20px 0 8px;
    }
    @media (max-width:600px){
      body{padding:12px}
      .hero{padding:36px 17px 28px;border-radius:22px}
      .menu-card{border-radius:22px}
      .pdf-frame{height:72vh;min-height:520px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="monogram">A&nbsp;R</div>
      <h1>עדי ורני</h1>
      <div class="date">06.09.2026</div>
      <div class="divider">♡</div>
      <p class="subtitle">תפריט החתונה שלנו</p>
      <a class="open-btn" href="menu.pdf" target="_blank" rel="noopener">פתחו את התפריט במסך מלא</a>
    </section>

    <section class="menu-card" aria-label="תפריט">
      <div class="menu-head">
        <h2>התפריט</h2>
        <p>אפשר לגלול כאן או לפתוח במסך מלא</p>
      </div>
      <object class="pdf-frame" data="menu.pdf#view=FitH" type="application/pdf">
        <iframe class="pdf-frame" src="menu.pdf#view=FitH" title="תפריט החתונה"></iframe>
      </object>
      <div class="fallback">
        אם התפריט לא מוצג במכשיר שלכם, לחצו על הכפתור למעלה לפתיחה ישירה של ה‑PDF.
      </div>
    </section>

    <footer>עדי ורני · 06.09.2026</footer>
  </main>
</body>
</html>
